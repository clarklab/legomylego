[model]
name = "Chicken"
design = "design.py"
description = "A blocky white chicken in 31 pieces, about 5 cm tall: a printed face, an orange beak over a red wattle, wings on the sides and yellow legs. zeldar's design, built as zeldar's instructions build it, with a jumper plate under the face so it sits centred, in line with the beak."
designer = "zeldar"           # someone else's design: who made it (the booklet and its page
source = "https://brickit.app/ideas/1ff0b486-ec13-474b-b23a-42492bd06964"   # say so), and
#                             # where the original is; with no name to give,
# credit = "..."              # our own sentence for it
designer_steps = true         # the steps are the designer's own, followed page by page
# brands = ["pokemon"]        # the logo cards on the Quick Bricks page it is filed under: a
#                             # logo's file name in brands/ (more than one is fine; none is too)
collection = "quick_bricks"

[palette]                     # role -> a real colour name; design.py places parts by role
white = "White"
yellow = "Yellow"             # the legs
red = "Red"                   # the wattle
orange = "Orange"             # the beak
black = "Black"

[booklet]
subtitle = "A blocky white chicken in 31 pieces. A design by zeldar."
intro = "Start with the 3 x 3 plate turned over and hang the legs under it on brackets, then build the body up on its top. The head grows forward from a headlight brick's stud: two bricks with studs on two sides, a 2 x 2 plate on each side, and the printed face, beak and red wattle on the front."
notes = ["The wings are 2 x 2 plates centred on single side studs: the stud goes up into the tube in the middle of the plate's underside.", "The two 1 x 1 plates behind the upper head brick go on its bottom first; then the three go on together, into the left side plate from the right.", "The face tile sits on a white jumper plate, as the beak tile does: a 1 x 2 tile cannot be centred on the brick's solid stud, but it can on a jumper's hollow one.", "The head is out in front of small feet: stand the chicken on a flat table."]

[checks]
enabled = ["real_elements", "connections", "collisions", "buildability", "stability",
           "mechanism", "electrics", "technique"]
[checks.stability]            # zeldar's head reaches out in front of 1 x 1 feet: the centre of
min_tilt_deg = 1.5            # mass is near their front edge, so it tips forward at about 2
                              # degrees (the check wants 10; the jumper under the face took it
                              # from 2.9 to 1.7). It is the design: kept as is

# Quick Bricks video (brickkit quick chicken). Pick a workshop the last few models did not
# use (brickkit status shows theirs); under 25 pieces the parts start laid out on the table
[quick]
surface = "green_mat"         # the white body and yellow legs stand out on green (grass)
room = "window"               # workbench | studio | window | night | bookshelf
light = "morning"             # morning | day | evening
seconds = 14
highlight = ["eyes", "beak"]  # the printed face going on, then the beak
close_ups = 2
music = false                 # just the clicks
