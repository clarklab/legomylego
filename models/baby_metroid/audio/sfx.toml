# Sound effects for the showreel's cold open (the lamp tapped on and off at night), generated
# with ElevenLabs' sound-generation API (Creator plan: commercial use allowed) by
# tools/elevenlabs_sfx.py. Each [[sfx]] makes NAME_1.mp3 .. NAME_<variants>.mp3 here;
# sfx_generated.json records the prompt and settings behind every file. The files are
# committed: the video rebuilds without calling the API, and a rerun of the tool only makes
# files that are missing. [video.audio] in model.toml picks the ones used. (Prompts for a
# quiet room tone and a lamp's mains hum came back near-silent or as a 10 kHz whine; the hum
# is synthesised instead, see brickkit/video/audio.py fx_hum.)

[defaults]
prompt_influence = 0.6       # 0..1: how literally the prompt is followed (API default 0.3)
model_id = "eleven_text_to_sound_v2"

[[sfx]]
name = "click"
seconds = 0.6
variants = 3
prompt = """A single crisp mechanical click of a small plastic push-button power switch being \
pressed down and released: a firm, satisfying click-clack, close microphone, completely dry, \
very short, nothing else. No music, no voices, no reverb."""

[[sfx]]
name = "snap_on"
seconds = 1.0
variants = 3
prompt = """A fun, bright, satisfying pop as a small lamp snaps on: a quick round bubbly pop \
with a short sparkly electric shimmer on top, playful and clean, cartoon-like but warm. No \
music, no voices."""

[[sfx]]
name = "snap_off"
seconds = 0.7
variants = 2
prompt = """A soft, gentle, descending bloop as a small lamp switches off: a muted low pop that \
drops in pitch and fades away quickly, playful and clean. No music, no voices."""

[[sfx]]
name = "crickets"
seconds = 10.0
variants = 2
loop = true
prompt = """Night ambience heard through a closed bedroom window: a steady chorus of crickets \
chirping outside, clearly audible, calm summer night in the countryside, continuous and even. \
No music, no voices, no wind, no cars."""
