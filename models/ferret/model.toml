[model]
name = "Ferret"
design = "design.py"
description = "A curious, life-size ferret mid-bounce in real LEGO: arched back, bandit mask, tongue out, and a head that turns on a turntable. Three coats: sable, albino and cinnamon."
palette_title = "Sable"

# Default colourway: sable (cream/tan body, dark brown legs, tail and bandit mask).
[palette]
coat = "Tan"                 # body
belly = "Tan"                # underside
dark = "Dark Brown"          # legs, tail, shoulders
mask = "Dark Brown"          # bandit mask round the eyes
face = "White"               # muzzle, chin, ear rims
nose = "Reddish Brown"
eye = "Black"
ear_inner = "Bright Pink"
tongue = "Coral"
whisker = "Black"
core = "Light Bluish Gray"   # hidden structure (same in every colourway)

[variants.albino]
title = "Albino"
coat = "White"
belly = "White"
dark = "White"
mask = "White"
face = "White"
nose = "Bright Pink"
eye = "Red"
whisker = "White"

[variants.cinnamon]
title = "Cinnamon"
coat = "Medium Nougat"
belly = "Tan"
dark = "Reddish Brown"
mask = "Reddish Brown"
face = "White"
nose = "Dark Pink"
eye = "Black"

[booklet]
subtitle = "Life-size (51 cm nose to tail) and mid-bounce, with the arched back ferrets run with. Build it in sable, albino or cinnamon: the same pieces, different colours."
intro = "The body is a sculpture of bonded bricks, built in three parts: the chest with the front legs, the hips with the hind legs, and the arched back that joins them. The head sits on a turntable so the ferret can look at you, and the round tail plugs onto studs at the rump."
notes = [
  "The chest and the hips are built upside down, then turned over.",
  "The head turns on a 2x2 turntable: set it to look at you after the last step.",
]
works = [
  { title = "A head that turns", text = "The head sits on a 2x2 turntable, so the ferret can look at you or away.", image = "renders/three_quarter.png" },
]

[checks]
enabled = ["real_elements", "connections", "collisions", "buildability", "stability",
           "mechanism", "electrics", "technique"]
[checks.stability]
min_margin = 0.25
min_tilt_deg = 10

# Build video (brickkit video): theme and callouts; see docs/brickkit-guide.md, "Video"
[video]
theme = "playful"
facts = ["life-size"]

[[video.callouts]]
label = "Turntable"
part = "3679"
xray = true

[[video.callouts]]
label = "Eyes"
tag = "eye_*"

[[video.callouts]]
label = "Ears"
tag = "ear_*"

[[video.callouts]]
label = "Whiskers"
tag = "whisker_*"

[[video.callouts]]
label = "Tongue"
tag = "tongue"
