[model]
name = "Nautilus"
design = "design.py"
description = "Captain Nemo's Nautilus from Walt Disney's 20,000 Leagues Under the Sea (1954) at minifigure scale, 106 cm long: its salon windows are LEGO's biggest clear bubbles. Big tiled side panels on hinges, the toothed crest arch over an alligator-head wheelhouse with bubble eyes, the saw keel, the shark's dorsal fin and the fish tail with its propeller and rudder; the port side of the salon swings up like a gull wing on Captain Nemo's salon - his pipe organ, library, aquarium and crew - and the whole ship rides a breaking sea on two clear posts. The salon lights up, the propeller spins and the rudder swings."
notice = "The Nautilus design is from Walt Disney's 20,000 Leagues Under the Sea (1954). Unofficial fan model, not affiliated with or endorsed by Disney."
palette_title = "Rusty iron"

# Roles -> real colours. The hull is Reddish Brown, weathered (naut_weather.py) in patches of
# dark iron, rust and worn bare metal; Dark Brown (`frame`) is kept for accents. The stand's and the salon's colours are named in
# naut_stand_big.py and naut_salon.py. One colourway: the film's rusty brown (no steel).
[palette]
hull = "Reddish Brown"         # the iron hull: panels, shells, side keels, deck, fins, wheelhouse
hull_dark = "Dark Brown"       # weathering (naut_weather.py): dark iron, lower down and in blotches
hull_rust = "Dark Orange"      # rust streaks running down the sides
hull_iron = "Dark Bluish Gray" # worn bare metal on the deck's walkway
grille = "Dark Bluish Gray"    # the vents' grilles in the deck
frame_iron = "Dark Bluish Gray" # the iron frame: the side keels' edges, the deck walkway, the keel
hull_lower = "Dark Brown"      # the hull under the side keels
core = "Reddish Brown"         # the core and the Technic bricks inside the hull
spine = "Reddish Brown"        # the teeth: the crest's spikes, the saw keel, the ram's point
frame = "Dark Brown"           # accents
trim = "Pearl Gold"            # brass: the salon windows' rings
hinge = "Black"                # the click hinges that hold the salon windows' bubbles
glass = "Trans-Clear"          # the windows' bubbles and the wheelhouse's eyes
lights = "Yellow"              # the eight lights round each salon window
lamp_base = "Yellow"           # under them, and under the wheelhouse's searchlight
lamp = "Trans-Yellow"          # the wheelhouse's searchlight
propeller = "Pearl Gold"
shaft = "Light Bluish Gray"    # the propeller's smooth pin
led = "Black"                  # Power Functions light heads

[booklet]
subtitle = "Captain Nemo's submarine from Walt Disney's 20,000 Leagues Under the Sea (1954) at minifigure scale, 106 cm long, over a breaking sea. Open the salon's side to find Nemo at his organ; the salon lights up, the propeller spins and the rudder swings."
intro = "The scale comes from the salon windows: each is LEGO's biggest clear bubble, a 6 x 6 half sphere, so the Nautilus is about 1:52 and its salon fits the crew. The hull starts from its side keels, two plates thick at the waterline, wedge plates making the taper; a core two studs wide stands on them up to the deck and hangs under them down to the keel. Along the midbody each side is four big tiled panels on clip-and-bar hinges, set at the hull's own angles so that seen head-on it is a lens; toward the bow and stern the hull is shells of plates built flat and pushed onto the core's side studs, each row capped with a chain of curved slopes, and inverted tiles smooth the belly. On the port side the salon's panels are one piece hinged at the deck's edge: lift it like a gull wing and Nemo's salon is there, with his pipe organ, the library, the aquarium, the table and the crew. Each window is the bubble in a brass ring in a raised boss with eight yellow lights round it. On top: the wheelhouse like an alligator's head with its bubble eyes and searchlight, the toothed crest arching from its peak down to the deck, the shark's dorsal fin, the raised after deck and a hatch, where Conseil and the diver stand. Underneath: the saw keel along the bow and two keel fins on the stand's clear posts. At the stern the fish tail's two swept lobes, the propeller turning in a brass guard ring and the rudder clipped to its post."
you_will_need = [
  "1x LEGO Power Functions LED light unit (8870): its two lamps hang under the salon's ceiling, one by each window.",
  "1x LEGO Power Functions extension wire (8871, 50 cm): from the light unit's plug down the front post to the battery box.",
  "6 AAA batteries for the Power Functions AAA battery box (set 88000, listed in the parts as 64228), which lies inside the sea base.",
]
notes = [
  "The lamps' leads run out along the salon's ceiling, down the hull's side past the salon floor, forward along the bottom of the hull to the shaft in the core over the front post, and down it. Lay them in before you close the salon and clip the lower panels on, and leave a little slack.",
  "Plug the light unit onto the extension wire, run the wire down the front post's clear tube and through the base to the battery box; set the Nautilus on its posts last.",
  "The salon's gull wing clips onto the bars on the side keels along its lower edge: lift that edge and swing it up over the deck to open the salon. The other side panels stay on.",
  "The propeller sits on a smooth pin: spin it with a finger. The rudder is clipped to its post and swings on it.",
  "Power Functions was discontinued in 2018: the light unit, the extension wire and the battery box are easy to find used on BrickLink.",
]
works = [
  { title = "The salon opens", text = "The port side of the salon is one big panel hinged on bars along the deck's edge: it swings up like a gull wing on Captain Nemo's salon, the organ, the library and the crew.", image = "hero_open/hero.png" },
  { title = "Lights in the salon", text = "Two Power Functions lamps under the salon's ceiling light the room, and it glows through both bubbles; the battery box in the sea switches them on and off.", image = "hero_lit/hero.png" },
]

[checks]
enabled = ["real_elements", "connections", "collisions", "buildability", "stability",
           "mechanism", "electrics", "technique"]
[checks.stability]
min_margin = 0.25
min_tilt_deg = 10

[video]
theme = "abyss"
facts = ["106 cm long", "Opening salon", "Lights"]
lights_label = "Salon lights"
lift_label = "Lifts off its stand"
lift = { exclude_tag = "stand", height = 80 }
# under a minute: the build and the checks punchy, the features quick, no lift, colourways or
# booklet; no small print in the outro (the URL stays)
beats = { build = 23, scan = 10, mechanism = 8, lights = 6, outro = 6 }
skip = ["lift", "colourways", "booklet"]
outro_small_print = false

# the cold open: the Nautilus cruising through deep water (the stand hidden), its propeller,
# rudder running (design.performance); two angles outside, then the camera in through the port
# window between Ned Land and Aronnax, round the salon past the library to Nemo at his organ,
# out through the starboard window and away into the dark (points in the hull frame: origin is
# Y_HULL; Nemo stands at x 50, z -40, the organ's console at x 100..180)
[video.cold_open]
scene = "deep_sea"
motion = "flythrough"
seconds = 13.6
[video.cold_open.flythrough]
origin = [0, -552, 0]
enter = [-60, -12, -200]
exit = [-60, -12, 200]
path = [[-60, -15, -125], [-60, -75, -40], [-20, -60, 10], [10, -75, 25], [-50, -80, 95]]
look = [[-60, -30, 40], [-200, -60, 60], [70, -35, -35], [100, -40, -25], [-60, -12, 200]]
slow = [1.3, 1.8, 2.2, 2.0, 1.0]
interior = { bounds = [[-280, -152, -140], [180, 64, 140]], tags = ["salon_interior"] }

# after the outro: the Nautilus in the dark sea, its salon lit, and a giant squid about its
# size coming out of the murk at it; the picture fades to black as it closes in
[video.coda]
scene = "deep_sea"
creature = "squid"
seconds = 4

# recorded sound (ElevenLabs music, Creator plan; prompts and plans in audio/sfx.toml, settings
# in audio/sfx_generated.json): the organ in Nemo's salon, and the reel's score - an epic
# orchestral adventure held to the reel's segments, from the cut out of the cold open (its
# opening hit as the open's brick lands) to an ominous swell dying away as the squid comes.
# The deep's own sounds are the deep_sea set's (brickkit/data/audio/deep_sea).
[video.audio]
dir = "audio"
organ = "organ_1.mp3"
music = "score_cut_2.mp3"
music_offset = 0.25
music_tail = 1.5

[[video.callouts]]
label = "Propeller"
tag = "prop"
sub = "spins on a smooth pin"

[[video.callouts]]
label = "Rudder"
tag = "rudder"
sub = "swings on its post"

[[video.callouts]]
label = "Salon window"
tag = "salon_port"
sub = "LEGO's biggest bubble"

[[video.callouts]]
label = "Gull-wing salon"
tag = "salon_panel"
sub = "swings up on Nemo's salon"
