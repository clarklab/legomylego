[model]
name = "Yoda PEZ"
design = "design.py"
brands = ["pez", "star-wars"]   # the logo cards on the Quick Bricks page it is filed under (brands/)
description = "A Yoda PEZ dispenser in 60 pieces, 10.6 cm tall, about the size of a real one: a sand green head with two printed eyes and long ears on a tan stem, and a head that tips back on a click hinge to show an orange sweet."
# designer = "..."            # someone else's design: who made it (the booklet and its page
# source = "https://..."      # say so), and where the original is; with no name to give,
# credit = "..."              # our own sentence for it
collection = "quick_bricks"

[palette]                     # role -> a real colour name; design.py places parts by role
stem = "Tan"                  # the foot, the stem, the two hinge plates
sweet = "Bright Light Orange" # the sweet under the head
head = "Sand Green"           # the head and its ears
eye = "White"                 # the two printed eyes

[booklet]
subtitle = "Two long ears on a tan stem, with a head that tips back like the real thing, in 60 pieces."
intro = "Start with the foot and the stem: four rounds of two plates and two bricks, four big tiles for the smooth sides, then the hinge plate and the sweet on top. The head is built by itself: the face on three tall bricks, a cheek for each side, then the ears and the top of the head. Its own hinge plate goes on the back last, and the head clicks onto the stem."
notes = ["The head tips back on its hinge in clicks, up to three of them, and the sweet shows. Push it back gently from the front, and tip it forward again until it rests on the sweet.",
         "It is tall on a small foot, like a real one, so a knock from the side tips it over. Stand it somewhere it will not be knocked."]

[checks]
enabled = ["real_elements", "connections", "collisions", "buildability", "stability",
           "mechanism", "electrics", "technique"]
[checks.stability]            # a PEZ dispenser is tall on a small foot, like the real one:
min_tilt_deg = 6              # it tips at about 7 degrees to the side (the check wants 10)

# Quick Bricks video (brickkit quick pez_yoda): a floor the model stands out on
[quick]
surface = "lego_blue"     # sand green stands out on blue
room = "bookshelf"
light = "day"
seconds = 18
flex = 2.8                    # before the cut the head tips back on its hinge, shows the sweet, and shuts
highlight = ["eyes", "ears", "sweet"]
close_ups = 3
music = false                 # just the clicks
