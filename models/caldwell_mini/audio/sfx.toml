# The mini courthouse's own sound for its Quick Bricks video (brickkit quick caldwell_mini): the
# clock tower's bell, tolling as the tower goes up. Generated with ElevenLabs' sound-generation
# API (Creator plan: commercial use allowed) by tools/elevenlabs_sfx.py caldwell_mini;
# sfx_generated.json records the prompt and settings behind every file. model.toml's
# [[quick.sound]] plays the one used.

[defaults]
prompt_influence = 0.6
model_id = "eleven_text_to_sound_v2"

[[sfx]]
name = "bell"
seconds = 5.0
variants = 4
prompt = """One single toll of a big bronze bell in an old courthouse clock tower: struck once, \
deep and resonant, then ringing out with a long, slow, natural decay. Just the one strike, \
starting at once. Heard clearly from the town square, no echo of other bells, no clock \
ticking, no music, no voices, nothing else."""
