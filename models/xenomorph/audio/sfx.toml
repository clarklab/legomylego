# The Xenomorph's own sound for its Quick Bricks video (brickkit quick xenomorph): an alien
# creature's hiss and screech as the last piece goes on. Generated with ElevenLabs'
# sound-generation API (Creator plan: commercial use allowed) by tools/elevenlabs_sfx.py
# xenomorph; sfx_generated.json records the prompt and settings behind every file.
# model.toml's [quick] ending plays the one used. The prompt describes a creature of our own:
# it does not ask for any film's sound.

[defaults]
prompt_influence = 0.6
model_id = "eleven_text_to_sound_v2"

[[sfx]]
name = "hiss"
seconds = 2.0
variants = 4
prompt = """A monstrous insect-like alien creature, very close: a wet, rasping hiss that rises \
at once into a short, piercing, inhuman screech and stops dead. One creature, one cry, \
starting at once. Dry and close, no echo, no music, no footsteps, no voices, nothing else."""
