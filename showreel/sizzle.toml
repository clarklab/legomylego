# The Bricks sizzle reel: `brickkit sizzle` (brickkit/video/sizzle.py) -> showreel/sizzle.mp4.
# Cut on the music's beats; shots are in beats, sections in bars (4 beats). Footage is each
# model's own (its showreel's cached plates, its turntable, its hero cut-out): run
# `brickkit video SLUG` for a model first.

title = "Bricks"
url = "bricks.superfun.games"
music = "audio/track_long_1.mp3"   # ElevenLabs music (audio/sfx.toml): 4 bars of intro, the
                                  # drop at bar 4, fills at the ends of bars 11 and 19, the
                                  # final hit on bar 22; its beats are detected
bpm = 128                       # what it was asked for (a hint for the beat tracker)
whoosh = "audio/whoosh_1.mp3"   # on every wipe
line = "{n} models · {pieces} pieces|every brick checked"
disclaimer = "Unofficial fan models · computer-checked, not yet built with real bricks"

[theme]                         # the site's colours over the house theme
bg = "#FFFDF5"
bg2 = "#FEDB05"
ink = "#24221C"
accent = "#A34C32"
muted = "#6B6660"

[timeline]                      # bars: the open (logo, tagline, teaser), the finale, the outro
open = 4
finale = 3
outro = 2
open_words = [["Real", 4], ["LEGO.", 6], ["Checked by", 8], ["computer.", 10]]   # [word, beat]

[[model]]
slug = "baby_metroid"
bars = 3
chips = ["pieces", "headline"]
[[model.shot]]
source = "build"
from = 0.2
to = 1.0
beats = 3
[[model.shot]]
source = "cold_open"            # the night room: the lamp snaps on, on the beat
at = 30
lead = 1
beats = 3
caption = "Tap: lights on"
sfx = "../models/baby_metroid/audio/snap_on_1.mp3"
sfx_align = "peak"
sfx_level = -1.0                # a click: its peak has to be high to cut through the music
[[model.shot]]
source = "turntable"
from = 0.0
speed = 2.0
beats = 3
[[model.shot]]
source = "cold_open"            # closer: dark, then on
at = 120
lead = 1
beats = 3
caption = "Lights up the room"
sfx = "../models/baby_metroid/audio/snap_on_2.mp3"
sfx_align = "peak"
sfx_level = -1.0

[[model]]
slug = "vhs_tape"
bars = 3
chips = ["pieces", "headline"]
[[model.shot]]
source = "build"
from = 0.25
to = 1.0
beats = 3
[[model.shot]]
source = "mechanism"            # the dust door swings up and lands open on the beat (the clunk)
at = 61
lead = 2
speed = 1.2
beats = 3
caption = "Dust door and reels"
sfx = "audio/vhs_clunk_1.mp3"
sfx_align = "peak"
sfx_level = -3.0
[[model.shot]]
source = "turntable"
from = 0.15
speed = 2.0
beats = 3
[[model.shot]]
source = "colourways@white"
from = 0.2
to = 0.9
beats = 3
caption = "White shell colourway"

[[model]]
slug = "ferret"
bars = 2
break = true                    # the kick and bass drop out: the drop comes back on the next
chips = ["pieces", "headline"]
[[model.shot]]
source = "build"
from = 0.3
to = 1.0
beats = 2
[[model.shot]]
source = "mechanism"            # the head turns to the camera
at = 96
lead = 2
speed = 1.3
beats = 3
caption = "Head turns to you"
[[model.shot]]
source = "turntable"
from = 0.35
speed = 2.0
beats = 3

[[model]]
slug = "caldwell_courthouse"
name = "Caldwell County Courthouse"   # "The ..." makes the tags too long
bars = 3                        # the second phrase opens on it, after the ferret's break
chips = ["pieces", "headline"]
[[model.shot]]
source = "build"
from = 0.15
to = 1.0
beats = 3
[[model.shot]]
source = "still"                # the clock close-up, a bell on the cut
file = "renders/tower_close.png"
push = 0.14
beats = 3
caption = "Real quartz clocks"
sfx = "audio/clock_bell_2.mp3"
sfx_align = "peak"
sfx_level = -12.0               # it rings on: its peak well down, or it swamps the section
[[model.shot]]
source = "mechanism"            # into the tower: the dome lifting, fastest on the beat
at = 60                         # set by the mechanism's program, not the roof: the top lifts
lead = 1                        # over pose t 0.35..1 = frames ~49-79 of the 6 s segment
zoom = 1.8                      # the tower is on the model's axis: the middle, near the top
focus = [0.5, 0.47]
beats = 3
caption = "Lift-off dome"
sfx = "audio/whoosh_2.mp3"
sfx_align = "peak"
sfx_level = -8.0
[[model.shot]]
source = "colourways@brownstone"   # its colourway: reddish brown trim
from = 0.0
to = 1.0
zoom = 1.6
focus = [0.49, 0.36]
beats = 3
caption = "Brownstone colourway"

[[model]]
slug = "chainsaw_face"
bars = 3
chips = ["pieces", "headline"]
[[model.shot]]
source = "cold_open"            # the sunset dance: a scream on the swing's peak
at = 57
lead = 2
beats = 3
sfx = "../models/chainsaw_face/audio/scream_3.mp3"
sfx_align = "peak"
sfx_level = -12.0
[[model.shot]]
source = "build"
from = 0.4
to = 1.0
beats = 2
caption = "Every joint poses"
[[model.shot]]
source = "cold_open"
at = 173
lead = 1
beats = 3
sfx = "../models/chainsaw_face/audio/scream_5.mp3"
sfx_align = "peak"
sfx_level = -12.0
[[model.shot]]
source = "turntable"            # from the front: it turns as it poses
from = 0.0
speed = 2.0
beats = 2
